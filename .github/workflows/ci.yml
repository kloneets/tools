name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Run Android isolated unit tests
        working-directory: android
        run: ./gradlew :app:testIsolatedUnitTest

      - name: Run Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug

  build-macos-arm64:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test macOS packaging
        run: go test . -run TestMacOSBuildPackaging -v

      - name: Build on Apple Silicon
        run: ./scripts/build-macos-arm64.sh --bundle

      - name: Package Apple Silicon artifact
        run: |
          tar -C dist -czf koko-tools-macos-arm64.tar.gz macos-arm64

      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: koko-tools-macos-arm64
          path: koko-tools-macos-arm64.tar.gz

  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run benchmarks
        run: |
          mkdir -p .artifacts
          go test ./src/notes ./src/settings -run '^$' -bench '.' -benchmem | tee .artifacts/benchmarks.txt

      - name: Publish benchmark summary
        if: always()
        run: |
          {
            echo "## Benchmark Results"
            echo
            echo '```text'
            cat .artifacts/benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .artifacts/benchmarks.txt
